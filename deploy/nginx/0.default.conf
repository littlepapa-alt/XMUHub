# Requests for no known site (bare IP, unknown Host): drop without answering.
# 2026-10-18 flood came in as "GET / Host: <ip>"; original kept at /root/0.default.conf.bak-20261018
server
{
    listen 80;
    listen 443 ssl ;
    http2 on;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}
