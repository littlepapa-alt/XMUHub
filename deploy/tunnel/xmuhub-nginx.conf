# XMUHub behind a Cloudflare Tunnel: /etc/nginx/conf.d/xmuhub.conf (http context).
# cloudflared is the only client and connects from this machine, so nginx listens on loopback
# only and takes the visitor from CF-Connecting-IP (X-Real-IP, which the server uses for its
# per-IP limits). Installed by deploy/tunnel/setup.sh.

# Static files don't count: one page view loads a dozen of them, mostly as 304s.
map $uri $xmuhub_req_key {
    ~^/(assets|vendor)/ "";
    default             $binary_remote_addr;
}
limit_req_zone $xmuhub_req_key zone=xmuhub_req:10m rate=10r/s;

log_format xmuhub_timing '$time_iso8601 $remote_addr "$request" $status $body_bytes_sent '
                         'rt=$request_time ut=$upstream_response_time uc=$upstream_connect_time';

map $http_upgrade $xmuhub_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 127.0.0.1:8080;
    server_name _;

    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    limit_req zone=xmuhub_req burst=80 nodelay;
    limit_req_status 429;
    limit_req_log_level warn;

    access_log /var/log/nginx/xmuhub.timing.log xmuhub_timing;
    client_max_body_size 50m;

    # The upload relay route (written by scripts/deploy.ps1, NGINX_EXT_DIR=/etc/nginx/xmuhub.d).
    include /etc/nginx/xmuhub.d/*.conf;

    location / {
        proxy_pass http://127.0.0.1:8089;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $xmuhub_connection_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
