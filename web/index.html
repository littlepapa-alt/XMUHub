<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{site.name}} · {{site.subtitle}}</title>
<meta name="description" content="{{site.description}}">
<meta name="theme-color" content="#14263a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101d2d" media="(prefers-color-scheme: dark)">
<link rel="icon" href="{{site.logo}}">
<link rel="apple-touch-icon" href="{{site.logo}}">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preload" href="{{site.background}}" as="image">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body data-page="home">
<header id="top" class="top"></header>
<script>try{var t=sessionStorage.getItem('ludao.top');if(t){document.getElementById('top').innerHTML=t;document.documentElement.classList.add('seen')}}catch(e){}</script>
<main><div class="wrap">
  <section class="hero">
    <img class="home-calligraphy home-calligraphy-left" src="/assets/site/home-left.png" alt="" aria-hidden="true" draggable="false">
    <img class="home-calligraphy home-calligraphy-right" src="/assets/site/home-right.png" alt="" aria-hidden="true" draggable="false">
    <img class="logo" src="{{site.logo}}" alt="">
    <h1><b>{{site.name}}</b></h1>
    <div class="slogan" id="slogan"></div>
    <p>{{site.slogan}}</p>
    <form class="bigsearch" action="/search" role="search">
      <input name="q" placeholder="课程名称或拼音首字母，如 wjf、dxwl" aria-label="搜索" autofocus>
      <button class="btn primary">搜索</button>
    </form>
    <div class="stats" id="stats"></div>
    <p class="small" style="margin:10px 0 0">第一次用？看看 <a href="/help">两分钟使用教程</a> · 资料群合作请见<a href="/help#coop">这里</a></p>
  </section>
  <div class="sections" id="sections"><div class="skeleton"></div></div>
  <p class="small muted" style="margin:12px 0 0;text-align:center">这里没找到？看看同学们整理在别处的 <a href="/links">站外资源</a>。</p>
  <div class="layout-side home-lists" style="margin-top:28px">
    <section class="card"><h2>最新上传</h2><div class="list" id="recent"><div class="skeleton"></div></div></section>
    <section class="card"><h2>下载最多</h2><div class="list" id="popular"><div class="skeleton"></div></div></section>
  </div>
</div></main>
<footer id="foot" class="foot"></footer>
<script>try{var f=sessionStorage.getItem('ludao.foot');if(f)document.getElementById('foot').innerHTML=f}catch(e){}</script>
<script type="module" src="/assets/pages/home.js"></script>
</body>
</html>
