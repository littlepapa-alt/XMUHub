<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>搜索课程与资料 · {{site.name}}</title><meta name="description" content="{{site.description}}"><link rel="icon" href="{{site.logo}}"><link rel="stylesheet" href="/assets/app.css"><link id="learning-css" rel="stylesheet" href="/assets/site/learning.css"></head><body data-page="search"><header id="top" class="top"></header><main><div class="learning wrap catalog"><div class="catalog-intro"><h1>课程目录</h1><p class="muted">按年级、学期查找课程。</p></div><form id="catalog-search" class="catalog-search" role="search"><input class="input" name="q" placeholder="课程名称、别名或拼音首字母" aria-label="搜索课程"><button class="btn primary">搜索</button></form><div class="catalog-tabs"><a class="active" id="course-tab" href="/browse">课程目录</a><a id="resource-tab" href="/search?type=resource">搜索资料</a></div><div class="catalog-layout"><aside class="catalog-filters"><div class="section-heading"><h2>筛选课程</h2><a href="/browse" class="small">重置</a></div><label class="field"><span>年级 / 分类</span><select id="grade" class="input"><option value="">全部年级</option></select></label><label class="field"><span>学期</span><select id="semester" class="input"><option value="">全部学期</option></select></label><label class="field"><span>资料收录</span><select id="availability" class="input"><option value="">全部课程</option><option value="ready">已有资料</option><option value="empty">等待分享</option></select></label><p class="small muted">资料类型、年份等筛选可在课程主页使用。</p><a href="/upload" class="btn">贡献课程资料</a></aside><section class="catalog-results"><div class="catalog-toolbar"><span id="result-count" role="status">正在加载课程…</span><div class="row"><select id="sort" class="input" aria-label="课程排序"><option value="name">课程名称</option><option value="count">资料数量最多</option></select><div class="view-toggle"><button type="button" id="grid-view" class="btn sm" aria-label="卡片视图">▦</button><button type="button" id="list-view" class="btn sm" aria-label="列表视图">☰</button></div></div></div><div id="course-results" class="course-grid"><div class="skeleton"></div></div><nav id="catalog-pager" class="row" aria-label="课程分页"></nav></section></div></div></main><footer id="foot" class="foot"></footer><script type="module" src="/assets/site/search.js"></script></body></html>
